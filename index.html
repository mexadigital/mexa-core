<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mexa POS - Demo Woppy</title>

  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #111827;
      --primary-hover: #000000;
      --danger: #b91c1c;
      --danger-hover: #991b1b;
      --success: #166534;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin: 0 0 20px 0;
      font-size: 32px;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 18px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--card);
      padding: 18px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid #e5e7eb;
    }

    input,
    button,
    select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #9ca3af;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .danger {
      background: var(--danger);
      color: white;
    }

    .danger:hover {
      background: var(--danger-hover);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      cursor: pointer;
    }

    li:hover {
      background: #f3f4f6;
    }

    .ok {
      color: var(--success);
      font-weight: bold;
    }

    .error {
      color: var(--danger);
      font-weight: bold;
    }

    .muted {
      color: var(--muted);
    }

    pre {
      background: #fcfcfc;
      border: 1px dashed #9ca3af;
      padding: 14px;
      border-radius: 10px;
      white-space: pre-wrap;
      margin: 0;
      min-height: 180px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 900px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h1>Mexa POS - Demo Woppy</h1>

  <div class="row">
    <div class="card">
      <h3>Login</h3>
      <input id="email" type="email" placeholder="Correo" />
      <input id="password" type="password" placeholder="Contraseña" />
      <button onclick="login()">Login</button>
      <p id="loginEstado" class="muted"></p>
    </div>

    <div class="card">
      <h3>Búsqueda rápida</h3>
      <input
        id="busqueda"
        placeholder="Buscar por código, clave o descripción..."
        oninput="buscar()"
      />
      <ul id="resultados"></ul>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <h3>Productos cargados</h3>
      <button onclick="cargarProductos()">Recargar productos</button>
      <ul id="listaProductos"></ul>
    </div>

    <div class="card">
      <h3>Carrito</h3>
      <ul id="carrito"></ul>

      <p><strong>Total:</strong> $<span id="total">0.00</span></p>

      <select id="formaPago" onchange="generarTicket()">
        <option value="efectivo">Efectivo</option>
        <option value="tarjeta">Tarjeta</option>
        <option value="transferencia">Transferencia</option>
      </select>

      <input
        id="monto"
        type="number"
        step="0.01"
        placeholder="Monto recibido"
        oninput="cambioCalc()"
      />

      <p><strong>Cambio:</strong> $<span id="cambio">0.00</span></p>

      <button onclick="vender()">Vender</button>
      <button class="danger" onclick="vaciarCarrito()">Vaciar carrito</button>

      <p id="ventaEstado" class="muted"></p>
    </div>
  </div>

  <div class="card">
    <h3>Ticket</h3>
    <pre id="ticket">Aquí aparecerá el ticket...</pre>
  </div>

  <script>
    const API = "https://mexa-core-1.onrender.com";
    let productos = [];
    let carrito = [];

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const estado = document.getElementById("loginEstado");

      estado.className = "muted";
      estado.innerText = "Iniciando sesión...";

      try {
        const res = await fetch(API + "/auth/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        console.log("LOGIN RESPONSE:", data);

        if (res.ok && data.access_token) {
          localStorage.setItem("token", data.access_token);
          estado.innerText = "Login OK";
          estado.className = "ok";
          await cargarProductos();
        } else {
          estado.innerText = data.detail || "Error en login";
          estado.className = "error";
        }
      } catch (error) {
        console.error(error);
        estado.innerText = "Error de conexión con backend";
        estado.className = "error";
      }
    }

    async function cargarProductos() {
      const token = localStorage.getItem("token");
      const lista = document.getElementById("listaProductos");

      if (!token) {
        lista.innerHTML = "<li>Primero inicia sesión</li>";
        return;
      }

      lista.innerHTML = "<li>Cargando productos...</li>";

      try {
        const res = await fetch(API + "/productos/productos/", {
          headers: {
            Authorization: "Bearer " + token
          }
        });

        const data = await res.json();
        console.log("PRODUCTOS:", data);

        if (!res.ok) {
          lista.innerHTML = "<li>Error cargando productos</li>";
          return;
        }

        productos = Array.isArray(data) ? data : [];
        renderProductos();
      } catch (error) {
        console.error(error);
        lista.innerHTML = "<li>Error de conexión</li>";
      }
    }

    function renderProductos() {
      const lista = document.getElementById("listaProductos");
      lista.innerHTML = "";

      if (productos.length === 0) {
        lista.innerHTML = "<li>No hay productos</li>";
        return;
      }

      productos.forEach((p) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${p.nombre || "Sin nombre"}</strong><br>
          Código: ${p.codigo || "-"}<br>
          Precio: $${Number(p.precio || 0).toFixed(2)}<br>
          Stock: ${p.cantidad ?? 0}
        `;
        li.onclick = () => add(p);
        lista.appendChild(li);
      });
    }

    function buscar() {
      const texto = document.getElementById("busqueda").value.trim().toLowerCase();
      const lista = document.getElementById("resultados");
      lista.innerHTML = "";

      if (!texto) return;

      const filtrados = productos.filter((p) => {
        const nombre = (p.nombre || "").toLowerCase();
        const codigo = (p.codigo || "").toLowerCase();
        const descripcion = (p.descripcion || "").toLowerCase();

        return (
          nombre.includes(texto) ||
          codigo.includes(texto) ||
          descripcion.includes(texto)
        );
      });

      if (filtrados.length === 0) {
        lista.innerHTML = "<li>No se encontraron productos</li>";
        return;
      }

      filtrados.slice(0, 20).forEach((p) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${p.nombre || "Sin nombre"}</strong><br>
          Código: ${p.codigo || "-"} | $${Number(p.precio || 0).toFixed(2)}
        `;
        li.onclick = () => {
          add(p);
          document.getElementById("busqueda").value = "";
          lista.innerHTML = "";
        };
        lista.appendChild(li);
      });
    }

    function add(p) {
      const encontrado = carrito.find((item) => item.id === p.id);

      if (encontrado) {
        encontrado.cantidad += 1;
      } else {
        carrito.push({
          id: p.id,
          nombre: p.nombre || "Sin nombre",
          codigo: p.codigo || "",
          precio: Number(p.precio || 0),
          cantidad: 1
        });
      }

      renderCarrito();
    }

    function renderCarrito() {
      const lista = document.getElementById("carrito");
      lista.innerHTML = "";

      if (carrito.length === 0) {
        lista.innerHTML = "<li>Carrito vacío</li>";
      }

      carrito.forEach((item) => {
        const subtotal = item.precio * item.cantidad;

        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${item.nombre}</strong><br>
          Código: ${item.codigo || "-"}<br>
          ${item.cantidad} x $${item.precio.toFixed(2)} = $${subtotal.toFixed(2)}
          <br><br>
          <button onclick="sumar(${item.id})">+1</button>
          <button onclick="restar(${item.id})">-1</button>
          <button class="danger" onclick="quitar(${item.id})">Quitar</button>
        `;
        lista.appendChild(li);
      });

      const total = carrito.reduce((acc, item) => acc + item.precio * item.cantidad, 0);
      document.getElementById("total").innerText = total.toFixed(2);

      cambioCalc();
      generarTicket();
    }

    function sumar(id) {
      const item = carrito.find((p) => p.id === id);
      if (item) {
        item.cantidad += 1;
        renderCarrito();
      }
    }

    function restar(id) {
      const item = carrito.find((p) => p.id === id);
      if (item) {
        item.cantidad -= 1;
        if (item.cantidad <= 0) {
          carrito = carrito.filter((p) => p.id !== id);
        }
        renderCarrito();
      }
    }

    function quitar(id) {
      carrito = carrito.filter((p) => p.id !== id);
      renderCarrito();
    }

    function vaciarCarrito() {
      carrito = [];
      document.getElementById("monto").value = "";
      document.getElementById("cambio").innerText = "0.00";
      document.getElementById("ventaEstado").innerText = "";
      document.getElementById("ventaEstado").className = "muted";
      renderCarrito();
      generarTicket();
    }

    function cambioCalc() {
      const total = Number(document.getElementById("total").innerText || 0);
      const recibido = Number(document.getElementById("monto").value || 0);
      const cambio = recibido - total;

      document.getElementById("cambio").innerText =
        cambio >= 0 ? cambio.toFixed(2) : "0.00";

      generarTicket();
    }

    function generarTicket() {
      const ticket = document.getElementById("ticket");
      const total = Number(document.getElementById("total").innerText || 0).toFixed(2);
      const formaPago = document.getElementById("formaPago").value;
      const recibido = Number(document.getElementById("monto").value || 0).toFixed(2);
      const cambio = document.getElementById("cambio").innerText;

      const ahora = new Date();
      const fecha = ahora.toLocaleDateString("es-MX");
      const hora = ahora.toLocaleTimeString("es-MX");

      let texto = "";
      texto += "WOPPY\n";
      texto += "Sucursal Demo\n";
      texto += "Dirección fiscal: PENDIENTE\n";
      texto += "Fecha: " + fecha + "\n";
      texto += "Hora: " + hora + "\n";
      texto += "------------------------------\n";

      if (carrito.length === 0) {
        texto += "Sin productos\n";
      } else {
        carrito.forEach((p) => {
          texto += `${p.nombre}\n`;
          texto += `${p.cantidad} x $${p.precio.toFixed(2)} = $${(p.cantidad * p.precio).toFixed(2)}\n`;
          texto += "------------------------------\n";
        });
      }

      texto += `TOTAL: $${total}\n`;
      texto += `FORMA DE PAGO: ${formaPago}\n`;
      texto += `RECIBIDO: $${recibido}\n`;
      texto += `CAMBIO: $${cambio}\n`;

      ticket.innerText = texto;
    }

    async function vender() {
      const token = localStorage.getItem("token");
      const estado = document.getElementById("ventaEstado");

      if (!token) {
        estado.innerText = "Primero inicia sesión";
        estado.className = "error";
        return;
      }

      if (carrito.length === 0) {
        estado.innerText = "El carrito está vacío";
        estado.className = "error";
        return;
      }

      const total = Number(document.getElementById("total").innerText || 0);
      const recibido = Number(document.getElementById("monto").value || 0);

      if (recibido < total) {
        estado.innerText = "Falta dinero para completar la venta";
        estado.className = "error";
        return;
      }

      estado.innerText = "Registrando venta...";
      estado.className = "muted";

      try {
        for (const p of carrito) {
          const res = await fetch(API + "/movimientos/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token
            },
            body: JSON.stringify({
              producto_id: p.id,
              tipo: "salida",
              cantidad: p.cantidad,
              usuario: "POS"
            })
          });

          const data = await res.json();
          console.log("MOVIMIENTO:", data);

          if (!res.ok) {
            estado.innerText = data.detail || "Error en venta";
            estado.className = "error";
            return;
          }
        }

        estado.innerText = "Venta registrada correctamente";
        estado.className = "ok";

        carrito = [];
        document.getElementById("monto").value = "";
        document.getElementById("cambio").innerText = "0.00";

        renderCarrito();
        await cargarProductos();
        generarTicket();
      } catch (error) {
        console.error(error);
        estado.innerText = "Error de conexión al vender";
        estado.className = "error";
      }
    }

    generarTicket();
  </script>

</body>
</html>
