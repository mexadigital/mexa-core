<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mexa POS</title>

  <style>
    body { font-family: Arial; background:#f4f6f8; padding:20px; }
    .card { background:white; padding:15px; margin-bottom:15px; border-radius:10px; }
    input, button, select { width:100%; padding:10px; margin-bottom:10px; }
    ul { list-style:none; padding:0; }
    li { background:#eee; padding:8px; margin-bottom:5px; cursor:pointer; }
    .danger { background:red; color:white; }
  </style>
</head>
<body>

<h1>Mexa POS</h1>

<div class="card">
  <h3>Login</h3>
  <input id="email" placeholder="Correo"/>
  <input id="password" type="password" placeholder="Contraseña"/>
  <button onclick="login()">Login</button>
  <p id="loginEstado"></p>
</div>

<div class="card">
  <h3>Búsqueda</h3>
  <input id="busqueda" placeholder="Buscar producto..." oninput="buscar()"/>
  <ul id="resultados"></ul>
</div>

<div class="card">
  <h3>Carrito</h3>
  <ul id="carrito"></ul>
  <p>Total: $<span id="total">0</span></p>

  <select id="formaPago">
    <option value="efectivo">Efectivo</option>
    <option value="tarjeta">Tarjeta</option>
  </select>

  <input id="monto" placeholder="Recibido" oninput="cambioCalc()"/>
  <p>Cambio: $<span id="cambio">0</span></p>

  <button onclick="vender()">Vender</button>
</div>

<script>
const API = "https://mexa-core-1.onrender.com";
let productos = [];
let carrito = [];

// LOGIN (CORREGIDO JSON)
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const estado = document.getElementById("loginEstado");

  const res = await fetch(API + "/auth/auth/login", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();
  console.log(data);

  if(res.ok){
    localStorage.setItem("token", data.access_token);
    estado.innerText = "Login OK";
    cargarProductos();
  } else {
    estado.innerText = data.detail;
  }
}

// CARGAR PRODUCTOS
async function cargarProductos(){
  const res = await fetch(API + "/productos/productos/", {
    headers:{ Authorization:"Bearer "+localStorage.getItem("token") }
  });
  productos = await res.json();
}

// BUSCAR
function buscar(){
  const texto = document.getElementById("busqueda").value.toLowerCase();
  const lista = document.getElementById("resultados");
  lista.innerHTML="";

  productos.filter(p =>
    p.nombre.toLowerCase().includes(texto) ||
    (p.codigo && p.codigo.toLowerCase().includes(texto))
  ).forEach(p=>{
    const li=document.createElement("li");
    li.innerText=p.nombre+" $"+p.precio;
    li.onclick=()=>add(p);
    lista.appendChild(li);
  });
}

// AGREGAR
function add(p){
  carrito.push(p);
  render();
}

// RENDER
function render(){
  const lista=document.getElementById("carrito");
  lista.innerHTML="";
  let total=0;

  carrito.forEach(p=>{
    const li=document.createElement("li");
    li.innerText=p.nombre+" $"+p.precio;
    lista.appendChild(li);
    total+=p.precio;
  });

  document.getElementById("total").innerText=total;
  cambioCalc();
}

// CAMBIO
function cambioCalc(){
  const total = Number(document.getElementById("total").innerText);
  const recibido = Number(document.getElementById("monto").value || 0);
  document.getElementById("cambio").innerText = recibido-total;
}

// VENTA
async function vender(){
  for(const p of carrito){
    await fetch(API+"/movimientos/",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer "+localStorage.getItem("token")
      },
      body: JSON.stringify({
        producto_id:p.id,
        tipo:"salida",
        cantidad:1,
        usuario:"POS"
      })
    });
  }
  alert("Venta hecha");
  carrito=[];
  render();
}
</script>

</body>
</html>
