<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEXA Formularios</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 1450px; margin: 0 auto; padding: 20px; }
    .header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:20px; flex-wrap:wrap; }
    h1,h2,h3 { margin-top:0; }
    .small { font-size:12px; color:#94a3b8; }
    .status { padding:10px 14px; border-radius:999px; background:#1e293b; border:1px solid #334155; font-size:13px; }
    .grid { display:grid; grid-template-columns:320px 360px 1fr; gap:20px; align-items:start; }
    .card { background:#111827; border:1px solid #1f2937; border-radius:14px; padding:18px; box-shadow:0 8px 20px rgba(0,0,0,.25); }
    label { display:block; margin:10px 0 6px; font-size:14px; color:#cbd5e1; }
    input,select,textarea,button { width:100%; padding:12px; border-radius:10px; border:1px solid #334155; background:#0b1220; color:#e2e8f0; font-size:14px; }
    textarea { min-height:80px; resize:vertical; }
    button { cursor:pointer; font-weight:bold; border:none; background:#2563eb; transition:.2s; }
    button:hover { opacity:.92; }
    button.secondary { background:#374151; }
    button.success { background:#16a34a; }
    button.whatsapp { background:#16a34a; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .mt { margin-top:12px; }
    .msg { display:none; margin-top:12px; padding:12px; border-radius:10px; font-size:14px; white-space:pre-wrap; }
    .msg.ok { display:block; background:rgba(22,163,74,.15); border:1px solid rgba(22,163,74,.45); color:#bbf7d0; }
    .msg.err { display:block; background:rgba(220,38,38,.15); border:1px solid rgba(220,38,38,.45); color:#fecaca; }
    .field { border:1px solid #334155; background:#0b1220; border-radius:12px; padding:12px; margin-bottom:10px; }
    .field strong { display:block; margin-bottom:4px; }
    .record { border:1px solid #334155; border-radius:12px; padding:12px; margin-top:10px; background:#0b1220; }
    .record-head { display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .record-actions { display:flex; gap:8px; margin-top:10px; }
    .record-actions button { padding:9px; }
    .empty { color:#94a3b8; padding:18px 0; text-align:center; }
    .hidden { display:none !important; }
    @media(max-width:1050px) { .grid { grid-template-columns:1fr 1fr; } .capture-card { grid-column:1/-1; } }
    @media(max-width:720px) { .grid,.row { grid-template-columns:1fr; } .wrap { padding:12px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>MEXA Formularios</h1>
        <div class="small">Crea un formato, captura información y genera un documento.</div>
      </div>
      <div id="sessionStatus" class="status">Sin sesión</div>
    </div>

    <section id="loginCard" class="card" style="max-width:520px;margin:0 auto 20px">
      <h2>Entrar a MEXA</h2>
      <label>Dirección de la API</label>
      <input id="apiBase" value="" placeholder="http://127.0.0.1:8000" />
      <label>Correo</label>
      <input id="email" type="email" placeholder="usuario@empresa.com" />
      <label>Contraseña</label>
      <input id="password" type="password" />
      <button class="mt" onclick="login()">Iniciar sesión</button>
      <div id="loginMsg" class="msg"></div>
    </section>

    <main id="app" class="grid hidden">
      <section class="card">
        <h2>1. Formatos</h2>
        <label>Formato activo</label>
        <select id="formSelect" onchange="seleccionarFormulario()"></select>

        <h3 class="mt">Crear formato</h3>
        <label>Nombre</label>
        <input id="formName" placeholder="Registro de calificaciones" />
        <label>Descripción</label>
        <textarea id="formDescription" placeholder="Información que capturará la institución"></textarea>
        <button class="mt" onclick="crearFormulario()">Crear formato</button>
        <div id="formMsg" class="msg"></div>
      </section>

      <section class="card">
        <h2>2. Campos</h2>
        <div id="fieldsList" class="empty">Selecciona un formato.</div>

        <h3 class="mt">Agregar campo</h3>
        <label>Etiqueta visible</label>
        <input id="fieldLabel" placeholder="Nombre del alumno" oninput="sugerirClave()" />
        <label>Clave interna</label>
        <input id="fieldKey" placeholder="nombre_alumno" />
        <div class="row">
          <div>
            <label>Tipo</label>
            <select id="fieldType" onchange="mostrarOpciones()">
              <option value="texto">Texto</option>
              <option value="numero">Número</option>
              <option value="fecha">Fecha</option>
              <option value="telefono">Teléfono</option>
              <option value="seleccion">Selección</option>
              <option value="parrafo">Texto largo</option>
            </select>
          </div>
          <div>
            <label>Obligatorio</label>
            <select id="fieldRequired"><option value="false">No</option><option value="true">Sí</option></select>
          </div>
        </div>
        <div id="optionsWrap" class="hidden">
          <label>Opciones separadas por coma</label>
          <input id="fieldOptions" placeholder="Primero, Segundo, Tercero" />
        </div>
        <button class="mt" onclick="agregarCampo()">Agregar campo</button>
        <div id="fieldMsg" class="msg"></div>
      </section>

      <section class="card capture-card">
        <h2>3. Capturar registro</h2>
        <div id="captureFields" class="empty">Agrega campos al formato para comenzar.</div>
        <button id="saveRecord" class="success mt hidden" onclick="guardarRegistro()">Guardar registro</button>
        <div id="recordMsg" class="msg"></div>

        <h2 class="mt">Registros recientes</h2>
        <div id="recordsList" class="empty">Todavía no hay registros.</div>
      </section>
    </main>
  </div>

  <script>
    let token = localStorage.getItem("mexa_token") || "";
    let formularios = [];
    let formularioActual = null;
    let registrosActuales = [];

    const $ = id => document.getElementById(id);
    const baseActual = () => $("apiBase").value.trim().replace(/\/$/, "") || location.origin;

    function mensaje(id, texto, ok=true) {
      const el = $(id); el.textContent = texto; el.className = `msg ${ok ? "ok" : "err"}`;
    }
    function limpiar(id) { $(id).className = "msg"; $(id).textContent = ""; }

    async function api(path, options={}) {
      const headers = { ...(options.headers || {}) };
      if (token) headers.Authorization = `Bearer ${token}`;
      if (options.body && !(options.body instanceof FormData)) headers["Content-Type"] = "application/json";
      const response = await fetch(baseActual() + path, { ...options, headers });
      if (!response.ok) {
        let detail = `Error ${response.status}`;
        try { const data = await response.json(); detail = data.detail || JSON.stringify(data); } catch (_) {}
        throw new Error(detail);
      }
      return response;
    }

    async function login() {
      limpiar("loginMsg");
      try {
        const response = await api("/auth/login", {
          method:"POST",
          body:JSON.stringify({ email:$("email").value.trim(), password:$("password").value })
        });
        const data = await response.json(); token = data.access_token;
        localStorage.setItem("mexa_token", token);
        await iniciarApp();
      } catch (error) { mensaje("loginMsg", error.message, false); }
    }

    async function iniciarApp() {
      try {
        const me = await (await api("/auth/me")).json();
        $("sessionStatus").textContent = `${me.nombre} · ${me.organizacion_nombre}`;
        $("loginCard").classList.add("hidden"); $("app").classList.remove("hidden");
        await cargarFormularios();
      } catch (_) {
        token = ""; localStorage.removeItem("mexa_token");
        $("loginCard").classList.remove("hidden"); $("app").classList.add("hidden");
      }
    }

    async function cargarFormularios(seleccionarId=null) {
      formularios = await (await api("/formularios/")).json();
      $("formSelect").innerHTML = `<option value="">Seleccionar…</option>` +
        formularios.map(f => `<option value="${f.id}">${esc(f.nombre)}</option>`).join("");
      if (seleccionarId) $("formSelect").value = String(seleccionarId);
      await seleccionarFormulario();
    }

    async function crearFormulario() {
      limpiar("formMsg");
      try {
        const response = await api("/formularios/", { method:"POST", body:JSON.stringify({
          nombre:$("formName").value.trim(), descripcion:$("formDescription").value.trim() || null
        })});
        const creado = await response.json();
        $("formName").value = ""; $("formDescription").value = "";
        mensaje("formMsg", "Formato creado. Ahora agrégale sus campos.");
        await cargarFormularios(creado.id);
      } catch(error) { mensaje("formMsg", error.message, false); }
    }

    async function seleccionarFormulario() {
      const id = Number($("formSelect").value);
      formularioActual = formularios.find(f => f.id === id) || null;
      pintarCampos(); pintarCaptura();
      if (formularioActual) await cargarRegistros();
      else $("recordsList").innerHTML = `<div class="empty">Todavía no hay registros.</div>`;
    }

    function pintarCampos() {
      const list = $("fieldsList");
      if (!formularioActual) { list.innerHTML = `<div class="empty">Selecciona un formato.</div>`; return; }
      if (!formularioActual.campos.length) { list.innerHTML = `<div class="empty">El formato todavía no tiene campos.</div>`; return; }
      list.innerHTML = formularioActual.campos.map(c => `<div class="field"><strong>${esc(c.etiqueta)}</strong><span class="small">${esc(c.clave)} · ${esc(c.tipo)}${c.obligatorio ? " · obligatorio" : ""}</span></div>`).join("");
    }

    function sugerirClave() {
      $("fieldKey").value = $("fieldLabel").value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
    }
    function mostrarOpciones() { $("optionsWrap").classList.toggle("hidden", $("fieldType").value !== "seleccion"); }

    async function agregarCampo() {
      limpiar("fieldMsg");
      if (!formularioActual) return mensaje("fieldMsg", "Primero selecciona o crea un formato.", false);
      try {
        await api(`/formularios/${formularioActual.id}/campos`, { method:"POST", body:JSON.stringify({
          etiqueta:$("fieldLabel").value.trim(), clave:$("fieldKey").value.trim(), tipo:$("fieldType").value,
          obligatorio:$("fieldRequired").value === "true", orden:formularioActual.campos.length,
          opciones:$("fieldOptions").value.trim() || null
        })});
        $("fieldLabel").value = ""; $("fieldKey").value = ""; $("fieldOptions").value = "";
        mensaje("fieldMsg", "Campo agregado."); await cargarFormularios(formularioActual.id);
      } catch(error) { mensaje("fieldMsg", error.message, false); }
    }

    function pintarCaptura() {
      const box = $("captureFields"), button = $("saveRecord");
      if (!formularioActual || !formularioActual.campos.length) {
        box.innerHTML = `<div class="empty">Agrega campos al formato para comenzar.</div>`; button.classList.add("hidden"); return;
      }
      box.innerHTML = formularioActual.campos.map(c => campoHtml(c)).join(""); button.classList.remove("hidden");
    }

    function campoHtml(c) {
      const required = c.obligatorio ? "required" : "";
      const label = `<label>${esc(c.etiqueta)}${c.obligatorio ? " *" : ""}</label>`;
      if (c.tipo === "seleccion") return `${label}<select data-campo="${c.id}" ${required}><option value="">Seleccionar…</option>${(c.opciones || "").split(",").filter(Boolean).map(o=>`<option>${esc(o.trim())}</option>`).join("")}</select>`;
      if (c.tipo === "parrafo") return `${label}<textarea data-campo="${c.id}" ${required}></textarea>`;
      const type = c.tipo === "numero" ? "number" : c.tipo === "fecha" ? "date" : c.tipo === "telefono" ? "tel" : "text";
      return `${label}<input data-campo="${c.id}" type="${type}" ${required} />`;
    }

    async function guardarRegistro() {
      limpiar("recordMsg");
      const inputs = [...$("captureFields").querySelectorAll("[data-campo]")];
      if (inputs.some(input => input.required && !input.value.trim())) return mensaje("recordMsg", "Completa los campos obligatorios.", false);
      try {
        const response = await api(`/formularios/${formularioActual.id}/registros`, { method:"POST", body:JSON.stringify({
          valores:inputs.map(input => ({ campo_id:Number(input.dataset.campo), valor:input.value.trim() || null }))
        })});
        const registro = await response.json(); inputs.forEach(input => input.value = "");
        mensaje("recordMsg", `Registro ${registro.folio} guardado.`); await cargarRegistros();
      } catch(error) { mensaje("recordMsg", error.message, false); }
    }

    async function cargarRegistros() {
      registrosActuales = await (await api(`/formularios/${formularioActual.id}/registros`)).json();
      if (!registrosActuales.length) { $("recordsList").innerHTML = `<div class="empty">Todavía no hay registros.</div>`; return; }
      $("recordsList").innerHTML = registrosActuales.map(r => {
        const resumen = r.valores.filter(v => v.valor).slice(0,3).map(v => `${esc(v.etiqueta)}: ${esc(v.valor)}`).join(" · ");
        return `<div class="record"><div class="record-head"><strong>${esc(r.folio)}</strong><span class="small">${new Date(r.created_at).toLocaleString()}</span></div><div class="small mt">${resumen}</div><div class="record-actions"><button onclick="imprimir(${r.id})">Imprimir / PDF</button><button class="whatsapp" onclick="whatsapp(${r.id})">WhatsApp</button></div></div>`;
      }).join("");
    }

    async function imprimir(id) {
      try {
        const response = await api(`/formularios/registros/${id}/imprimir`);
        const html = await response.text(); const blob = new Blob([html], {type:"text/html"});
        window.open(URL.createObjectURL(blob), "_blank");
      } catch(error) { mensaje("recordMsg", error.message, false); }
    }

    function whatsapp(registroId) {
      const registro = registrosActuales.find(item => item.id === registroId);
      if (!registro) return;
      const tel = registro.valores.find(v => v.clave.includes("telefono"))?.valor || "";
      const texto = `Hola. Te compartimos el documento ${formularioActual.nombre}, folio ${registro.folio}, generado por MEXA.`;
      window.open(`https://wa.me/${tel.replace(/\D/g, "")}?text=${encodeURIComponent(texto)}`, "_blank");
    }

    function esc(value) { return String(value ?? "").replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch])); }

    $("apiBase").value = location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8000";
    if (token) iniciarApp();
  </script>
</body>
</html>
