<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEXA Escolar · Constancias</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#e5edf7}
    .wrap{max-width:1220px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
    h1{margin:0;font-size:30px}.muted{color:#91a4bc;font-size:13px}.badge{padding:9px 13px;border-radius:999px;background:#122238;border:1px solid #29415e}
    .grid{display:grid;grid-template-columns:380px 1fr;gap:20px;margin-top:22px}.card{background:#0d1a2b;border:1px solid #1e3651;border-radius:16px;padding:18px;box-shadow:0 14px 35px #0004}
    label{display:block;margin:12px 0 6px;color:#b9c9dc;font-size:14px}input,select,textarea,button{width:100%;border-radius:10px;border:1px solid #2a4563;background:#081421;color:#eaf2fb;padding:12px;font-size:14px}
    textarea{min-height:74px;resize:vertical}button{border:0;background:#1d6fe8;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.08)}button.green{background:#168348}button.gold{background:#a96900}button.gray{background:#334b66}button.red{background:#a83232}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{width:auto;padding:9px 12px}
    .item{border:1px solid #203b58;border-radius:13px;padding:14px;margin-top:12px;background:#091625}.item-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.state{font-size:11px;font-weight:bold;padding:6px 8px;border-radius:999px;background:#203a59;white-space:nowrap}
    .folio{font-weight:700}.msg{display:none;padding:11px;border-radius:9px;margin-top:12px}.msg.ok{display:block;background:#143d2a;color:#baf4ce}.msg.err{display:block;background:#4a1f27;color:#ffc3ca}
    .hidden{display:none!important}.empty{text-align:center;color:#8fa3ba;padding:30px 5px}@media(max-width:820px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="wrap">
  <div class="top"><div><h1>MEXA Escolar</h1><div class="muted">Constancias verificables, revisión humana y entrega controlada.</div></div><div id="sesion" class="badge">Sin sesión</div></div>

  <section id="login" class="card" style="max-width:500px;margin:30px auto">
    <h2>Entrar</h2><label>Correo</label><input id="email" type="email"><label>Contraseña</label><input id="password" type="password">
    <button style="margin-top:14px" onclick="entrar()">Iniciar sesión</button><div id="loginMsg" class="msg"></div>
  </section>

  <main id="app" class="grid hidden">
    <section class="card"><h2>Nueva solicitud</h2>
      <label>Buscar por nombre o matrícula</label><div class="row"><input id="buscar" placeholder="Ej. ANA o A-102"><button onclick="cargarAlumnos()">Buscar</button></div>
      <label>Alumno</label><select id="alumno"></select>
      <label>Tipo de documento</label><select id="tipo"><option value="constancia_estudios">Constancia de estudios</option></select>
      <label>Motivo</label><input id="motivo" placeholder="Beca, empleo, trámite…">
      <label>Destinatario</label><input id="destinatario" placeholder="A quien corresponda">
      <div class="row"><div><label>Entrega</label><select id="medio"><option value="digital">Digital</option><option value="recoger_original">Original</option><option value="ambos">Digital y original</option></select></div><div><label>Costo</label><input id="monto" type="number" min="0" step="0.01" value="0"></div></div>
      <label>Observaciones</label><textarea id="observaciones"></textarea>
      <button class="green" style="margin-top:14px" onclick="crearSolicitud()">Crear solicitud</button><div id="formMsg" class="msg"></div>
    </section>

    <section class="card"><div class="top"><div><h2 style="margin:0">Solicitudes</h2><div class="muted">Pago → revisión → autorización → entrega</div></div><button style="width:auto" onclick="cargarSolicitudes()">Actualizar</button></div>
      <div id="lista" class="empty">Cargando…</div>
    </section>
  </main>
</div><script>
  let token=localStorage.getItem('mexa_token')||''; let alumnos=[];
  const $=id=>document.getElementById(id); const apiBase=location.origin;
  function msg(id,texto,ok=true){const e=$(id);e.textContent=texto;e.className='msg '+(ok?'ok':'err')}
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  async function api(path,opt={}){const h={...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;if(opt.body)h['Content-Type']='application/json';const r=await fetch(apiBase+path,{...opt,headers:h});if(!r.ok){let d='Error '+r.status;try{d=(await r.json()).detail||d}catch{}throw new Error(d)}return r}
  async function entrar(){try{const r=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=(await r.json()).access_token;localStorage.setItem('mexa_token',token);await iniciar()}catch(e){msg('loginMsg',e.message,false)}}
  async function iniciar(){try{const me=await(await api('/auth/me')).json();$('sesion').textContent=me.nombre+' · '+me.organizacion_nombre;$('login').classList.add('hidden');$('app').classList.remove('hidden');await cargarAlumnos();await cargarSolicitudes()}catch{token='';localStorage.removeItem('mexa_token');$('login').classList.remove('hidden');$('app').classList.add('hidden')}}
  async function cargarAlumnos(){try{const q=$('buscar').value.trim();alumnos=await(await api('/escolar/alumnos'+(q?'?q='+encodeURIComponent(q):''))).json();$('alumno').innerHTML=alumnos.length?alumnos.map(a=>`<option value="${a.id}">${esc(a.matricula)} · ${esc(a.nombre_completo)}</option>`).join(''):'<option value="">Sin resultados</option>'}catch(e){msg('formMsg',e.message,false)}}
  async function crearSolicitud(){try{const alumno_id=Number($('alumno').value);if(!alumno_id)throw new Error('Selecciona un alumno');await api('/escolar/constancias',{method:'POST',body:JSON.stringify({alumno_id,tipo:$('tipo').value,motivo:$('motivo').value.trim()||null,destinatario:$('destinatario').value.trim()||null,medio_entrega:$('medio').value,monto:Number($('monto').value||0),observaciones:$('observaciones').value.trim()||null})});msg('formMsg','Solicitud creada. No se emitirá hasta revisarla y autorizarla.');await cargarSolicitudes()}catch(e){msg('formMsg',e.message,false)}}
  function alumnoNombre(id){return alumnos.find(a=>a.id===id)?.nombre_completo||('Alumno #'+id)}
  function botones(s){let b='';if(s.estado==='PAGO_PENDIENTE')b+=`<button class="green" onclick="pago(${s.id})">Validar pago</button>`;if(s.estado==='SOLICITADA')b+=`<button onclick="accion(${s.id},'revisar')">Revisar</button>`;if(s.estado==='EN_REVISION')b+=`<button class="gold" onclick="accion(${s.id},'autorizar')">Autorizar</button>`;if(s.estado==='AUTORIZADA'||s.estado==='LISTA_PARA_RECOGER'||s.estado==='ENTREGADA')b+=`<button class="gray" onclick="documento(${s.id})">Abrir PDF</button>`;if(s.estado==='AUTORIZADA'&&s.requiere_original)b+=`<button onclick="accion(${s.id},'lista-recoger')">Lista para recoger</button>`;if(s.estado==='AUTORIZADA'||s.estado==='LISTA_PARA_RECOGER')b+=`<button class="green" onclick="accion(${s.id},'entregar')">Entregar</button>`;if(!['ENTREGADA','CANCELADA'].includes(s.estado))b+=`<button class="red" onclick="cancelar(${s.id})">Cancelar</button>`;return b}
  async function cargarSolicitudes(){try{const datos=await(await api('/escolar/constancias')).json();$('lista').innerHTML=datos.length?datos.map(s=>`<article class="item"><div class="item-top"><div><div class="folio">${esc(s.folio)}</div><div>${esc(alumnoNombre(s.alumno_id))}</div><div class="muted">Pago: ${esc(s.estado_pago)} · $${Number(s.monto).toFixed(2)} · ${esc(s.medio_entrega)}</div></div><span class="state">${esc(s.estado)}</span></div><div class="actions">${botones(s)}</div></article>`).join(''):'<div class="empty">Todavía no hay solicitudes.</div>'}catch(e){$('lista').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
  async function pago(id){const ref=prompt('Referencia del pago (opcional):')||null;try{await api(`/escolar/constancias/${id}/pago`,{method:'PATCH',body:JSON.stringify({estado_pago:'PAGADO',referencia_pago:ref})});await cargarSolicitudes()}catch(e){alert(e.message)}}
  async function accion(id,nombre){try{await api(`/escolar/constancias/${id}/${nombre}`,{method:'POST'});await cargarSolicitudes()}catch(e){alert(e.message)}}
  async function cancelar(id){const motivo=prompt('Motivo de cancelación:');if(!motivo)return;try{await api(`/escolar/constancias/${id}/cancelar?motivo=${encodeURIComponent(motivo)}`,{method:'POST'});await cargarSolicitudes()}catch(e){alert(e.message)}}
  async function documento(id){try{const html=await(await api(`/escolar/constancias/${id}/documento`)).text();const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert(e.message)}}
  iniciar();
</script></body></html>
